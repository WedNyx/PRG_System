name: Qualidade — testes, tipos, lint e build

on:
  # Todas as PRs para a main: testes unitários, tipos, lint dos módulos novos e build (v0.33.6).
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Instalar dependências sem modificar o lockfile
        run: npm ci
      - name: Testes unitários (todos)
        run: npm test
      - name: Checar tipos
        run: npx tsc --noEmit
      - name: Lint dos módulos novos e revisados (bloqueia)
        run: >-
          npx eslint
          src/lib/sistemas/dnd2024*.ts src/lib/sistemas/modoProgressao*.ts src/lib/sistemas/arvore*.ts src/lib/sistemas/conferencia*.ts
          src/lib/nuvem/validacaoProgressao.test.ts
          src/components/fichas/ProgressaoDnd2024.tsx src/components/fichas/SeletorModoProgressao.tsx src/components/fichas/SeletorFontes.tsx
          src/components/fichas/MagiasDnd2024.tsx src/components/fichas/MulticlasseDnd2024.tsx src/components/fichas/ExcecaoModo.tsx
          src/components/fichas/ConferenciaFicha.tsx src/components/fichas/Arvore.tsx src/components/fichas/BarraRecurso.tsx src/components/NaTela.tsx
          src/components/mestre src/app/mestre
          "src/app/api/prg/fichas/[id]/route.ts" "src/app/api/prg/campanhas/[id]/route.ts"
      - name: Lint geral (informativo — existem pendências anteriores no projeto)
        continue-on-error: true
        run: npm run lint
      - name: Build
        run: npm run build
      # Somente esta PR: navegador Chromium com viewport móvel controlada;
      # dados fictícios injetados no localStorage; sem usar API ou banco real.
      - name: Smoke mobile 2014 — 320/375/390/768px
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/fase2-arvores-unificadas-verticais'
        run: |
          # Não tocar node_modules do projeto: npm install --no-save falha no
          # lockfile desta combinação npm/Next 16 em runners 2026.
          mkdir -p "$RUNNER_TEMP/prg-playwright"
          npm install --prefix "$RUNNER_TEMP/prg-playwright" --no-save --package-lock=false playwright@1.56.1
          "$RUNNER_TEMP/prg-playwright/node_modules/.bin/playwright" install --with-deps chromium
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/prg-next-mobile.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID || true' EXIT
          PRG_PLAYWRIGHT_MODULE="$RUNNER_TEMP/prg-playwright/node_modules/playwright/index.mjs" node scripts/mobileSmokeDnd2014.mjs
      - name: Screenshots do teste móvel
        if: always() && github.event_name == 'pull_request' && github.head_ref == 'feat/fase2-arvores-unificadas-verticais'
        uses: actions/upload-artifact@v4
        with:
          name: dnd2014-mobile-${{ github.sha }}
          path: artifacts/mobile-2014/
          if-no-files-found: ignore
          retention-days: 7
