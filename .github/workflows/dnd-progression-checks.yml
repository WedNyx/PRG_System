name: Qualidade — testes, tipos, lint e build

on:
  # Todas as PRs para a main: testes unitários, tipos, lint dos módulos novos e build (v0.33.6).
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Instalar dependências sem modificar o lockfile
        run: npm ci
      - name: Testes unitários (todos)
        run: npm test
      - name: Checar tipos
        run: npx tsc --noEmit
      - name: Lint dos módulos novos e revisados (bloqueia)
        run: >-
          npx eslint
          src/lib/sistemas/dnd2024*.ts src/lib/sistemas/modoProgressao*.ts src/lib/sistemas/arvore*.ts src/lib/sistemas/conferencia*.ts
          src/lib/nuvem/validacaoProgressao.test.ts
          src/components/fichas/ProgressaoDnd2024.tsx src/components/fichas/SeletorModoProgressao.tsx src/components/fichas/SeletorFontes.tsx
          src/components/fichas/MagiasDnd2024.tsx src/components/fichas/MulticlasseDnd2024.tsx src/components/fichas/ExcecaoModo.tsx
          src/components/fichas/ConferenciaFicha.tsx src/components/fichas/Arvore.tsx src/components/fichas/BarraRecurso.tsx src/components/NaTela.tsx
          src/components/mestre src/app/mestre
          "src/app/api/prg/fichas/[id]/route.ts" "src/app/api/prg/campanhas/[id]/route.ts"
      - name: Lint geral (informativo — existem pendências anteriores no projeto)
        continue-on-error: true
        run: npm run lint
      - name: Build
        run: npm run build
